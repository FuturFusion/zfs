name: Release (reusable)

# Not meant to be run directly. Builds ZFS packages for a given release tag
# and publishes a GitHub release from the results. Called from:
#
#   * release-on-tag.yml  -- fires on a pushed debian/* tag (manually tagging,
#     or a re-spin like debian/2.4.4-1), passing github.ref_name straight through.
#
# Tags look like debian/2.4.4-1: "debian/" + ZFS version + "-" + a build
# iteration number. The iteration number exists so a mistake can be fixed
# with a debian/2.4.4-2 re-release of the same ZFS version, rather than forcing
# a new ZFS point release just to re-spin the packaging. That build
# version (e.g. "2.4.4-1", not a timestamp) becomes the .deb package version
# directly -- see _build-zfs.yml's package_version input.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build, e.g. debian/2.4.4-1. Must already exist."
        required: true
        type: string

permissions:
  contents: read

jobs:
  parse-tag:
    name: Parse the release tag
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.parse.outputs.package_version }}
      zfs_version: ${{ steps.parse.outputs.zfs_version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Parse ZFS version and package version from the tag
        id: parse
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG}"

          package_version="${tag#debian/}"
          zfs_version="${package_version%-*}"

          if ! grep "zfs-linux ($package_version) unstable;" debian/changelog > /dev/null; then
            echo "FAIL: Debian package version $package_version doesn't appear to be released."
            exit 1
          fi

          echo "Tag: $tag -> ZFS version $zfs_version, package version $package_version"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "zfs_version=$zfs_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: parse-tag
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    uses: ./.github/workflows/_build-zfs.yml
    with:
      arch: ${{ matrix.arch }}
      package_version: ${{ needs.parse-tag.outputs.package_version }}
      zfs_version: ${{ needs.parse-tag.outputs.zfs_version }}

  release:
    name: Create the GitHub release
    needs: [parse-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Download all built artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Create the release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ZFS_VERSION: ${{ needs.parse-tag.outputs.zfs_version }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "error: no build artifacts were found to attach to the release" >&2
            exit 1
          fi

          mkdir upload/
          cp artifacts/zfs-amd64/* upload/
          cp artifacts/zfs-arm64/* upload/

          notes="FuturFusion ZFS packages for version $ZFS_VERSION."

          gh release create "$TAG" \
            --title "ZFS $ZFS_VERSION ($TAG)" \
            --notes "$notes" \
            upload/*
